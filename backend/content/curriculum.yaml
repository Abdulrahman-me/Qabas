        focus: {en: "Questions relevant to a prophethood claim"}
      - slot: "0.11"
        lesson_id: les_u0_l11
        working_title: {en: "Muhammad ﷺ and His Claim", ar: "محمد ﷺ وادّعاؤه"}
        focus: {en: "The earlier foundations brought together around his claim"}
      - slot: "0.12"
        lesson_id: les_u0_l12
        working_title: {en: "So What Is Islam?", ar: "فما الإسلام إذن؟"}
        focus: {en: "Creator → One God → Guidance → Revelation → Messenger → Islam"}

