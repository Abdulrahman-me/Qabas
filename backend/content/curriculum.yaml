      - slot: "0.7"
        lesson_id: les_u0_l7
        working_title: {en: "How Could Guidance Reach Us?", ar: "كيف يمكن أن تصل الهداية إلينا؟"}
        focus: {en: "Revelation and messengers"}
      - slot: "0.8"
        lesson_id: les_u0_l8
        working_title: {en: "How Would We Test a Claim of Revelation?", ar: "كيف نختبر ادّعاء الوحي؟"}
