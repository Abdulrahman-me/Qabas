# Qabas curriculum: Units 0-10 (01_PRODUCT/CURRICULUM_AND_LEARNING_DESIGN.md, owner-confirmed 2026-10-03).
#
# What this file is: the curriculum structure engineers build for: units, track membership, track-framed
# unit titles/subtitles, lesson slots (curriculum positions with canonical lesson IDs) and the concept graph.
# It holds no lesson content: a slot becomes learner-facing only when a lesson version for it is approved
# and published (factory Gate 2 or an approved gold import).
#
# Review status: WORKING COPY pending scholarly/curriculum review (O-12). English titles are the curriculum's
# working titles. Arabic unit titles come from the handoff where it provides them (API examples, the Unit 0
# authoring brief) and are otherwise working translations; all are replaceable when O-12 approves the copy.
# Unit guides are authored and reviewed content and stay absent (has_guide = false) until approved.
#
# Rules (validated by app/content/curriculum.py; invalid data fails, nothing is repaired):
#   * unit ids unit_<n>, unique non-negative indices; tracks are explorer and/or new_muslim
#   * every track a unit serves has a title and subtitle in ar and en
#   * slot "<unit index>.<n>" has lesson_id les_u<unit index>_l<n>, n = 1.. contiguous; position index = n - 1
#   * concept prerequisites resolve inside the graph and never form a cycle
#   * curriculum position orders the Roadmap only; access depends on approved prerequisites (AD-29)

schema: qabas.curriculum/1
review_status: working

units:
  - unit_id: unit_0
    index: 0
    tracks: [explorer]
    art_key: questions
    pass_percent: 80
    title:
      ar: {explorer: "ابدأ بسؤال"}
      en: {explorer: "Start With a Question"}
    subtitle:
      ar: {explorer: "أسس قبل الأسئلة الكبرى"}
      en: {explorer: "Foundations before the big questions"}
    goal:
      en: "Build the foundation required before revelation, prophethood and unseen claims are presented for evaluation. Explorers then enter Unit 1."
    lessons:
      - slot: "0.1"
        lesson_id: les_u0_l1
        working_title: {en: "Do You Have to See It to Know It?", ar: "هل يجب أن تراه لتعرفه؟"}
        focus: {en: "Observation, evidence/inference and reliable testimony through simple examples"}
      - slot: "0.2"
        lesson_id: les_u0_l2
        working_title: {en: "Could Something Come From Nothing?", ar: "هل يمكن أن يأتي شيء من لا شيء؟"}
        focus: {en: "The existence question without abstract vocabulary"}
      - slot: "0.3"
        lesson_id: les_u0_l3
        working_title: {en: "Could Something Create Itself?", ar: "هل يمكن أن يخلق شيء نفسه؟"}
        focus: {en: "An intuitive example that exposes the self-creation problem"}
      - slot: "0.4"
        lesson_id: les_u0_l4
        working_title: {en: "What Would a Creator Be Like?", ar: "كيف يكون الخالق؟"}
        focus: {en: "Independence, non-dependence, Creator versus creation"}
      - slot: "0.5"
        lesson_id: les_u0_l5
        working_title: {en: "One Creator or Many?", ar: "خالق واحد أم أكثر؟"}
        focus: {en: "An accessible introduction to divine oneness"}
      - slot: "0.6"
        lesson_id: les_u0_l6
