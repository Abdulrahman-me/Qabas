# Recorded clip set for the real recitation model (Phase 10 tracker: "a recorded clip set (≥10 clips)").
#
# Reciter clips are referenced, not committed: their redistribution licence is O-06. scripts/recitation_clip_set.py
# downloads them into backend/var/recitation_bench/ (git-ignored), records each SHA-256 on first fetch and refuses
# a changed file later. Silence and noise clips are generated by the test. Held-out *learner* audio (accents,
# errors, noise) is the O-06 acceptance gate and is not part of this set; these clips prove the pipeline end to end.
# "check" is the verse/range checked (defaults to the clip's own verse).
#
# expect: passed | failed | unclear (the correct outcome); "observed" would record a known model error that differs.
# classes: minimum word counts per outcome class (QUALITY acceptance: correct/missing/substituted/extra/unclear).
# "cut" keeps only the first fraction of the decoded audio (a recitation that stops early).

schema: qabas.recitation_clip_set/1
reciter: "Alafasy (Quran.com verse audio, recitation id 7)"
base_url: "https://verses.quran.com/Alafasy/mp3/"
clips:
  - {id: fatiha_1, file: "001001.mp3", verse: [1, 1], expect: passed}
  - {id: fatiha_2, file: "001002.mp3", verse: [1, 2], expect: passed}
  - {id: fatiha_3, file: "001003.mp3", verse: [1, 3], expect: passed}
  - {id: fatiha_4, file: "001004.mp3", verse: [1, 4], expect: passed}
  - {id: fatiha_5, file: "001005.mp3", verse: [1, 5], expect: passed}
  - {id: fatiha_6, file: "001006.mp3", verse: [1, 6], expect: passed}
  # The six-count madd of ٱلضَّآلِّينَ: the VAD alone cut it off (F-91, F-95); kept through voicing (D-118).
  - {id: fatiha_7, file: "001007.mp3", verse: [1, 7], expect: passed, classes: {correct: 9}}
  - {id: ikhlas_1, file: "112001.mp3", verse: [112, 1], expect: passed}
  - {id: ikhlas_2, file: "112002.mp3", verse: [112, 2], expect: passed}
  - {id: ikhlas_3, file: "112003.mp3", verse: [112, 3], expect: passed}
  - {id: ikhlas_4, file: "112004.mp3", verse: [112, 4], expect: passed}
  - {id: nisa_103, file: "004103.mp3", verse: [4, 103], expect: passed}
  - {id: nisa_103_segment, file: "004103.mp3", verse: [4, 103], check: {words: [14, 20]}, expect: passed,
     classes: {correct: 7, extra: 1}}
  - {id: wrong_verse, file: "112001.mp3", verse: [112, 1], check: {verse: [112, 3]}, expect: failed,
     classes: {substituted: 1}}
  - {id: wrong_fatiha, file: "001002.mp3", verse: [1, 2], check: {verse: [1, 5]}, expect: failed,
     classes: {substituted: 1}}
  - {id: stopped_early, file: "004103.mp3", verse: [4, 103], cut: 0.45, expect: failed, classes: {missing: 1}}
  - {id: silence, generated: silence, verse: [112, 1], expect: unclear}
  - {id: noise, generated: noise, verse: [112, 1], expect: unclear}
