name: qabas
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  qabas_scene:
    path: packages/qabas_scene
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  get_it: ^9.3.0
  dio: ^5.11.1
  go_router: ^18.0.2
  json_annotation: ^4.12.0
  rive: ^0.14.11
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  audioplayers: ^6.8.1
  just_audio: ^0.10.6
  record: ^7.1.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  web: ^1.1.1
  cached_network_image: ^4.0.3
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  flutter_timezone: ^5.1.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  path_parsing: ^1.1.0
  logging: ^1.3.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.15.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/characters/guide_traveler/
    - assets/onboarding/
    # ── Mock data: dev/demo builds only. Contains private answer keys. Remove this block (or move it
    #    under asset flavors) for a production release — see docs/handoff/07 §8.
    - assets/mocks/contract/
    - assets/mocks/contract/challenges/
    - assets/mocks/contract/curriculum_test/
    - assets/mocks/contract/curriculum_test/assessments/
    - assets/mocks/contract/curriculum_test/bank/
    - assets/mocks/contract/curriculum_test/lessons/
    - assets/mocks/contract/exercises/categorize__buckets/
    - assets/mocks/contract/exercises/categorize__day_arc/
    - assets/mocks/contract/exercises/fill_blank/
    - assets/mocks/contract/exercises/flashcard/
    - assets/mocks/contract/exercises/map_place__hotspots/
    - assets/mocks/contract/exercises/map_place__map_pins/
    - assets/mocks/contract/exercises/match_pairs/
    - assets/mocks/contract/exercises/multiple_choice/
    - assets/mocks/contract/exercises/order_steps/
    - assets/mocks/contract/exercises/recite_verse/
    - assets/mocks/contract/exercises/scenario/
    - assets/mocks/contract/exercises/spot_error/
    - assets/mocks/contract/exercises/timeline_order/
    - assets/mocks/contract/exercises/true_false/
    - assets/mocks/contract/exercises/true_false_reason/
    - assets/mocks/contract/exercises/verse_meaning/
    - assets/mocks/contract/exercises/which_evidence/
    - assets/mocks/contract/mock_assets/
    - assets/mocks/contract/mock_assets/audio/
    - assets/mocks/contract/mock_assets/maps/
    - assets/mocks/contract/mock_assets/scenes/scn_test_desert_well/v2/
    - assets/mocks/contract/mock_assets/test/
    - assets/mocks/contract/negative/
    - assets/mocks/contract/presentation/
    - assets/mocks/contract/recitation/
    - assets/mocks/contract/scenes/
    - assets/mocks/contract/sessions/
    - assets/mocks/contract/workflows/
    - assets/mocks/demo_curriculum/
    - assets/mocks/examples/
    - assets/mocks/glossary/
    - assets/mocks/private/
    - assets/mocks/private/test_lessons/
    - assets/mocks/private/unit0/
    - assets/mocks/reviewer/
    - assets/mocks/recording/
    - assets/mocks/salah/
    - assets/mocks/test_lessons/
    - assets/mocks/unit0/
    - assets/mocks/unit0/media/fallbacks/
    - assets/mocks/unit0/media/scenes/
    - assets/mocks/unit0/sessions/

  fonts:
    # Latin interface
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
    # Arabic interface (IBM Plex Sans Arabic)
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
    # Special moments, Latin
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    # Special moments in Arabic, hadith, canonical Arabic terms
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-400.ttf
          weight: 400
        - asset: assets/fonts/Amiri-700.ttf
          weight: 700
    # Quran text (text_uthmani) only — never stylised
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-400.ttf
